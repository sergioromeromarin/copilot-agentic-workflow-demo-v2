name: Agentic PR (elevated)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to analyze"
        required: true
        type: string
      mode:
        description: "elevated mode: tests|fix|both"
        required: true
        default: "tests"
        type: choice
        options:
          - tests
          - fix
          - both

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Recommended: protect this environment in GitHub settings to require approval
    environment: agent-elevated

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-runner/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install runner deps
        working-directory: agent-runner
        run: npm ci

      - name: Build runner
        working-directory: agent-runner
        run: npm run build

      - name: Run agent (elevated)
        working-directory: agent-runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_MODE: elevated
          AGENT_ELEVATED_MODE: ${{ inputs.mode }}
          AGENT_PR_NUMBER: ${{ inputs.pr_number }}
          AGENT_EXEC: dotnet,npm
          AGENT_ARTIFACT_DIR: artifacts/agent
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: node dist/index.js

      - name: Attach report to job summary
        if: always()
        run: |
          if [ -f agent-runner/artifacts/agent/report.md ]; then
            cat agent-runner/artifacts/agent/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-report-elevated
          path: agent-runner/artifacts/agent
